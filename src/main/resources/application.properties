spring.application.name=jogo-ratinho

# Banco salvo em arquivo para manter o ranking
spring.datasource.url=jdbc:h2:file:./dados/ranking
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria e atualiza as tabelas sem apagar os resultados
spring.jpa.hibernate.ddl-auto=update

server.port=8081